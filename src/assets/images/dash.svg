<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1 10 2">
  <style>
    line {
      animation: dash-animation 1s linear infinite;
      stroke-dasharray: 0.5;
    }

    @keyframes dash-animation {
      from {
        stroke-dashoffset: 1;
      }
    }
  </style>
  <line
    x1="0"
    y1="0"
    x2="10"
    y2="0"
    stroke="black"
    stroke-width="2"
    pathLength="1"
  />
</svg>
