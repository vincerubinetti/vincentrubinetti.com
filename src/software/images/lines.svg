<svg xmlns="http://www.w3.org/2000/svg">
  <rect
    width="100%"
    height="100%"
    fill="none"
    stroke="oklch(85% 0.025 60)"
    stroke-width="2"
    stroke-dasharray="4 4"
    vector-effect="non-scaling-stroke"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="8"
      to="0"
      dur="0.5s"
      repeatCount="indefinite"
    />
  </rect>
</svg>
